name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 🔴🔴 v0.0.109：macos-14 → macos-15。
    #    2026-11-01 起 CI 全部「启动 1 秒被取消、0 个步骤、没分到 runner」，
    #    查 check-run 注解拿到原话：
    #      "This job failed because of a scheduled macOS 14 runner image brownout.
    #       macOS 14 runner images will be retired on November 2, 2026."
    #    ⇒ 不是代码问题、不是额度问题，是 GitHub 在退役 macos-14。明天就正式停用，本来也得换。
    #    判据（当时怎么排除的）：同一次 push 上 ubuntu-latest 的极简 job **成功** ⇒ 账号/Actions 正常，
    #    只有 macos-14 这个标签的 job 被秒取消 ⇒ 锁定在镜像标签上。
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install dpkg ldid

      - name: Setup roothide Theos + iPhoneOS16.5 SDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk
          echo "SDK 就位："
          ls "$THEOS/sdks"

      - name: Build package (roothide, arm64e)
        run: make package FINALPACKAGE=1

      - name: Verify deb produced
        run: |
          set -e
          ls -la packages/
          test -n "$(ls -A packages/*.deb)"

      - name: Show deb payload
        run: |
          for d in packages/*.deb; do
            echo "=== $d ==="
            dpkg-deb -c "$d" || true
            dpkg-deb -f "$d" || true
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: notifybox-deb
          path: packages/*.deb
          if-no-files-found: error

      # 关键：把 deb 推到公开分支 ci-deb，这样任何人（包括没有 PAT 的自动化）都能匿名下载。
      # 只允许 main 的 push 触发，避免 PR 也能写分支。
      - name: Publish deb to ci-deb branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 🔴 必须用**绝对路径**：下面会 cd 到 /tmp/pub，相对路径就失效了。
          #    上一版就是栽在这 —— 先 cd 再 cp，报 "No such file or directory"。
          DEB=$(ls "$GITHUB_WORKSPACE"/packages/*.deb | head -1)
          NAME=$(basename "$DEB")
          SHORT=$(git rev-parse --short HEAD)
          echo "发布：$NAME  (commit $SHORT)"

          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp "$DEB" /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-deb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "本分支由 CI 自动发布，请勿手改。"
            echo "commit: $SHORT"
            echo "deb   : $NAME"
            echo "下载  : https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-deb/${NAME}"
          } > 说明.txt
          git add -A
          git commit -q -m "ci-deb: $SHORT $NAME"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-deb

          echo "已发布：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-deb/${NAME}"
